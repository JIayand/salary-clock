name: SalaryClock
options:
  bundleIdPrefix: com.jyd
  deploymentTarget:
    macOS: "13.0"

targets:
  SalaryClock:
    type: application
    platform: macOS
    sources:
      - path: Sources/SalaryClock
        excludes:
          - .backups/**
      - path: Resources
      - path: CHANGELOG.md
        buildPhase: resources
      - path: Localization
    dependencies:
      - target: SalaryClockWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyd.salaryclock.desktop
        DEVELOPMENT_TEAM: WXFKXAFBJ8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SalaryClock
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Configuration/SalaryClock.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/SalaryClock-Info.plist
        MARKETING_VERSION: 1.2.2
        CURRENT_PROJECT_VERSION: 1.2.2
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO

  SalaryClockWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
        excludes:
          - .backups/**
      - path: Sources/SalaryClock/SalaryCalculator.swift
      - path: Sources/SalaryClock/WorkBreakRecord.swift
      - path: Sources/SalaryClock/NumericFormatting.swift
      - path: Sources/SalaryClock/SalaryProgressBar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyd.salaryclock.desktop.widget
        MARKETING_VERSION: 1.2.2
        DEVELOPMENT_TEAM: WXFKXAFBJ8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SalaryClockWidgetExtension
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Configuration/SalaryClockWidget.entitlements
        INFOPLIST_FILE: Configuration/SalaryClockWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CURRENT_PROJECT_VERSION: 1.2.2
